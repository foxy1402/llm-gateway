name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: gofmt
        # Runs on a fresh Linux checkout, so line endings are LF and this is a true
        # formatting check (a Windows worktree with CRLF drift reports false hits).
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: |
          # Pinned: @latest can break the gate the day a release adds checks.
          go install honnef.co/go/tools/cmd/staticcheck@v0.6.1
          staticcheck ./...

      - name: go test
        run: go test ./... -race -count=1 -timeout 5m

      - name: go build
        run: go build -ldflags="-s -w" -trimpath ./...
