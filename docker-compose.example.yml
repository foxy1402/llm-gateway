services:
  gateway:
    image: ghcr.io/foxy1402/llm-gateway:latest
    ports:
      - "8080:8080"
    environment:
      GATEWAY_API_KEY: "gw-change-me"
      DASHBOARD_PASSWORD: "change-me"
      DASHBOARD_SECRET: "a-random-32-char-string-goes-here"
      DB_PATH: "/data/gateway.db"
      # GATEWAY_LISTEN: "8080"     # bare port also works (normalized to :8080)
      # GATEWAY_LOG_LEVEL: "info"
      # REQUEST_TIMEOUT: "60s"
    volumes:
      - gateway_data:/data
    restart: unless-stopped
    # No healthcheck: the distroless image has no shell, wget, or curl to probe
    # with. If your platform supports raw TCP/HTTP health checks, point it at
    # GET /healthz on port 8080 instead.

volumes:
  gateway_data:
